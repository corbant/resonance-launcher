<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup TV Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            padding: 24px;
            margin: 0;
        }
        h2 { font-size: 22px; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; margin-bottom: 24px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #1E1E1E;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #FFFFFF;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>Set up your TV Launcher</h2>
<p>Paste your API keys below to configure your TV home screen.</p>

<form action="/save" method="post">
    <label for="tmdb">TMDb API Key</label>
    <input id="tmdb" type="text" name="tmdb_key" placeholder="Enter TMDb Key" required/>

    <label for="watchmode">Watchmode API Key</label>
    <input id="watchmode" type="text" name="watchmode_key" placeholder="Enter Watchmode Key"/>

    <button type="submit">Save & Finish Setup</button>
</form>
</body>
</html>
